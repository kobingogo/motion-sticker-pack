<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f7f3eb"/>
  <circle cx="1010" cy="90" r="54" fill="none" stroke="#a26cff" stroke-width="5"/>
  <text x="72" y="112" font-family="Noto Sans SC" font-size="28" fill="#26323a">X 短片 · 工作流说明</text>
  <text x="72" y="190" font-family="Noto Sans SC" font-size="62" font-weight="800" fill="#17232b">一张角色图</text>
  <text x="72" y="264" font-family="Noto Sans SC" font-size="62" font-weight="800" fill="#d86b2f">变成一整套动态表情</text>
  <text x="72" y="318" font-family="Noto Sans SC" font-size="28" fill="#55616a">motion-sticker-pack 的可复用制作链路</text>

  <g transform="translate(72 390)">
    <rect width="936" height="132" rx="28" fill="#e5f2ff" stroke="#17232b" stroke-width="3"/>
    <circle cx="70" cy="66" r="34" fill="#ffffff" stroke="#17232b" stroke-width="3"/>
    <text x="70" y="78" text-anchor="middle" font-size="34">1</text>
    <text x="132" y="60" font-family="Noto Sans SC" font-size="34" font-weight="700" fill="#17232b">上传角色参考图</text>
    <text x="132" y="98" font-family="Noto Sans SC" font-size="24" fill="#55616a">可以是人物、宠物、吉祥物或已有静态图板</text>
  </g>
  <path d="M540 540v54" stroke="#d86b2f" stroke-width="8" stroke-linecap="round"/>
  <path d="M524 580l16 18 16-18" fill="none" stroke="#d86b2f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(72 610)">
    <rect width="936" height="132" rx="28" fill="#f2eaff" stroke="#17232b" stroke-width="3"/>
    <circle cx="70" cy="66" r="34" fill="#ffffff" stroke="#17232b" stroke-width="3"/>
    <text x="70" y="78" text-anchor="middle" font-size="34">2</text>
    <text x="132" y="60" font-family="Noto Sans SC" font-size="34" font-weight="700" fill="#17232b">选择风格 + Emoji</text>
    <text x="132" y="98" font-family="Noto Sans SC" font-size="24" fill="#55616a">例如：3D 卡通风 + 开心 / 喜欢 / 惊讶</text>
  </g>
  <path d="M540 760v54" stroke="#d86b2f" stroke-width="8" stroke-linecap="round"/>
  <path d="M524 800l16 18 16-18" fill="none" stroke="#d86b2f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(72 830)">
    <rect width="936" height="132" rx="28" fill="#ffe9dc" stroke="#17232b" stroke-width="3"/>
    <circle cx="70" cy="66" r="34" fill="#ffffff" stroke="#17232b" stroke-width="3"/>
    <text x="70" y="78" text-anchor="middle" font-size="34">3</text>
    <text x="132" y="60" font-family="Noto Sans SC" font-size="34" font-weight="700" fill="#17232b">先确认静态表情板</text>
    <text x="132" y="98" font-family="Noto Sans SC" font-size="24" fill="#55616a">确认后才进入动画，避免错误结果继续流转</text>
  </g>
  <path d="M540 980v54" stroke="#d86b2f" stroke-width="8" stroke-linecap="round"/>
  <path d="M524 1020l16 18 16-18" fill="none" stroke="#d86b2f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(72 1050)">
    <rect width="936" height="160" rx="28" fill="#dff3eb" stroke="#17232b" stroke-width="3"/>
    <circle cx="70" cy="80" r="34" fill="#ffffff" stroke="#17232b" stroke-width="3"/>
    <text x="70" y="92" text-anchor="middle" font-size="34">4</text>
    <text x="132" y="62" font-family="Noto Sans SC" font-size="34" font-weight="700" fill="#17232b">生成、切图、导出</text>
    <text x="132" y="105" font-family="Noto Sans SC" font-size="24" fill="#55616a">动画 → 独立贴纸 → WebP / GIF / PNG / ZIP</text>
  </g>
  <text x="72" y="1290" font-family="Noto Sans SC" font-size="24" fill="#69757d">开源 · 可复用 · 结果可检查</text>
</svg>
