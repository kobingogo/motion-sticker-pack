<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f7f3eb"/>
  <path d="M930 80c54 12 78 40 78 88" fill="none" stroke="#ffb51b" stroke-width="8" stroke-linecap="round"/>
  <text x="72" y="112" font-family="Noto Sans SC" font-size="28" fill="#26323a">motion-sticker-pack · 开源 Skill</text>
  <text x="72" y="220" font-family="Noto Sans SC" font-size="64" font-weight="800" fill="#17232b">三步开始</text>
  <text x="72" y="292" font-family="Noto Sans SC" font-size="64" font-weight="800" fill="#d86b2f">制作动态表情包</text>
  <text x="72" y="354" font-family="Noto Sans SC" font-size="28" fill="#55616a">面向 Codex，支持角色图、静态图板和九宫格视频</text>

  <rect x="72" y="430" width="936" height="190" rx="28" fill="#17232b"/>
  <text x="112" y="492" font-family="Menlo,Monaco,monospace" font-size="25" fill="#a7e8cf">$</text>
  <text x="145" y="492" font-family="Menlo,Monaco,monospace" font-size="25" fill="#ffffff">npx skills add</text>
  <text x="145" y="536" font-family="Menlo,Monaco,monospace" font-size="25" fill="#ffca7a">kobingogo/motion-sticker-pack</text>
  <text x="145" y="580" font-family="Menlo,Monaco,monospace" font-size="25" fill="#ffffff">-g -y -a codex</text>

  <g transform="translate(72 700)">
    <rect width="936" height="132" rx="28" fill="#e5f2ff" stroke="#17232b" stroke-width="3"/>
    <circle cx="70" cy="66" r="34" fill="#ffffff" stroke="#17232b" stroke-width="3"/>
    <text x="70" y="78" text-anchor="middle" font-size="34">1</text>
    <text x="132" y="60" font-family="Noto Sans SC" font-size="34" font-weight="700" fill="#17232b">安装 Skill</text>
    <text x="132" y="98" font-family="Noto Sans SC" font-size="24" fill="#55616a">安装后在 Codex 对话中调用</text>
  </g>
  <g transform="translate(72 870)">
    <rect width="936" height="132" rx="28" fill="#f2eaff" stroke="#17232b" stroke-width="3"/>
    <circle cx="70" cy="66" r="34" fill="#ffffff" stroke="#17232b" stroke-width="3"/>
    <text x="70" y="78" text-anchor="middle" font-size="34">2</text>
    <text x="132" y="60" font-family="Noto Sans SC" font-size="34" font-weight="700" fill="#17232b">输入调用词</text>
    <text x="132" y="98" font-family="Menlo,Monaco,monospace" font-size="24" fill="#55616a">$motion-sticker-pack</text>
  </g>
  <g transform="translate(72 1040)">
    <rect width="936" height="160" rx="28" fill="#ffe9dc" stroke="#17232b" stroke-width="3"/>
    <circle cx="70" cy="80" r="34" fill="#ffffff" stroke="#17232b" stroke-width="3"/>
    <text x="70" y="92" text-anchor="middle" font-size="34">3</text>
    <text x="132" y="62" font-family="Noto Sans SC" font-size="34" font-weight="700" fill="#17232b">上传图，选择风格和 Emoji</text>
    <text x="132" y="105" font-family="Noto Sans SC" font-size="24" fill="#55616a">确认静态图后，再继续生成动画</text>
  </g>
  <text x="72" y="1290" font-family="Noto Sans SC" font-size="24" fill="#69757d">GitHub: github.com/kobingogo/motion-sticker-pack</text>
</svg>
