    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const panels = gsap.utils.toArray('[data-composition-id="character-gallery"] .gallery-panel');
        const videos = gsap.utils.toArray('[data-composition-id="character-gallery"] .sticker-video');

        tl.from('[data-composition-id="character-gallery"] .gallery-topline', { y: -24, opacity: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.15);
        panels.forEach((panel, index) => {
          const start = index * 2.8;
          tl.from(panel, { y: 34, scale: 0.97, opacity: 0, duration: 0.55, ease: "power3.out" }, start + 0.2);
          const panelVideos = panel.querySelectorAll(".sticker-video");
          tl.from(panelVideos, { scale: 0.72, opacity: 0, duration: 0.38, stagger: 0.055, ease: "back.out(1.4)" }, start + 0.42);
          if (index < panels.length - 1) {
            tl.to(panel, { opacity: 0, scale: 0.98, duration: 0.35, ease: "power2.in" }, start + 2.42);
          }
        });

        tl.from('[data-composition-id="character-gallery"] .gallery-count', { x: 18, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.35);

        window.__timelines = window.__timelines || {};
        window.__timelines["character-gallery"] = tl;
      })();
