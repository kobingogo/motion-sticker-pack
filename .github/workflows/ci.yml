name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python -m py_compile scripts/*.py
      - run: python scripts/style_selector.py --verify-only
      - run: python scripts/build_gallery_provenance.py --verify-only
      - run: python scripts/check_benchmark.py
      - run: python scripts/check_repository_policy.py
      - run: node --check scripts/video_gateway.mjs
