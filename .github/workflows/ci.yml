name: ci

on:
  # Protected-branch validation runs once per PR.  Keeping the required
  # check on the PR event avoids duplicate push/PR check-runs for the same
  # commit, where a canceled duplicate can block an otherwise green merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and pull-request events for the same source branch share one run.
  # This prevents a stale duplicate check from blocking a protected branch.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python -m py_compile scripts/*.py
      - run: python scripts/style_selector.py --verify-only
      - run: python scripts/build_gallery_provenance.py --verify-only
      - run: python scripts/check_benchmark.py
      - run: python scripts/check_repository_policy.py
      - run: node --check scripts/video_gateway.mjs
